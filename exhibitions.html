<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exhibitions — Motormouth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .exh-item { cursor: default; }
    .exh-item.linked {
      cursor: pointer; text-decoration: none; display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.5rem; align-items: start;
      padding: 1.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: background 0.15s, padding-left 0.15s;
    }
    .exh-item.linked:last-child { border-bottom: none; }
    .exh-item.linked:hover { padding-left: 0.75rem; }
    .exh-item.linked:hover .exh-name { color: var(--yellow); }
    .exh-item.linked:hover .exh-year { color: rgba(245,240,232,0.5); }
    .exh-item.linked .exh-arrow {
      align-self: center; font-family: 'Space Mono', monospace; font-size: 0.8rem;
      color: rgba(245,240,232,0.2); transition: color 0.15s, transform 0.15s;
    }
    .exh-item.linked:hover .exh-arrow { color: var(--yellow); transform: translateX(4px); }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="index.html" class="nav-logo">Motormouth<span>.</span></a>
    <button class="nav-burger" id="burgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="works.html">Works</a></li>
      <li><a href="exhibitions.html" class="active">Exhibitions</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="page-header-inner">
      <div>
        <span class="tag yellow">CV</span>
        <h1 class="section-title" style="margin-top:0.5rem">Exhibitions</h1>
      </div>
      <p class="page-header-sub">
        Solo and group exhibitions from 2021 to present — from Hobart to Sydney, print rooms to gallery walls.
      </p>
    </div>
  </div>

  <section id="exhibitions">
    <div class="container">

      <div class="exh-tabs reveal">
        <button class="exh-tab active" data-tab="solo">Solo Shows</button>
        <button class="exh-tab" data-tab="group">Group Shows</button>
      </div>

      <div class="exh-list active" id="tab-solo">
        <!-- rendered by JS -->
      </div>

      <div class="exh-list" id="tab-group">
        <!-- rendered by JS -->
      </div>

    </div>
  </section>

  <footer>
    <a href="index.html" class="footer-logo">Motormouth<span>.</span></a>
    <div class="footer-copy">© 2025 Motormouth / Lily Langley — All rights reserved</div>
  </footer>

  <script>
    document.getElementById('burgerBtn').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    document.querySelectorAll('.exh-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.exh-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.exh-list').forEach(l => l.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        observeReveal();
      });
    });

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });

    function observeReveal() {
      document.querySelectorAll('.reveal:not(.visible)').forEach(el => io.observe(el));
    }

    function renderExhibitions(exhibitions) {
      const solo  = exhibitions.filter(e => e.type === 'solo');
      const group = exhibitions.filter(e => e.type === 'group');

      document.getElementById('tab-solo').innerHTML  = buildList(solo);
      document.getElementById('tab-group').innerHTML = buildList(group);
      observeReveal();
    }

    function isUpcoming(ex) {
      // Parse the end date from the dates string, e.g. "2 – 17 October 2025" or "9 July – 2 August 2025"
      const today = new Date(); today.setHours(0,0,0,0);
      const str = ex.dates || '';
      // Try to extract the last date portion (end date)
      const months = { january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11 };
      // Match patterns like "9 July – 2 August 2025" or "2 – 17 October 2025"
      const m = str.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
      if (m) {
        const month = months[m[2].toLowerCase()];
        if (month !== undefined) {
          const end = new Date(parseInt(m[3]), month, parseInt(m[1]));
          return end >= today;
        }
      }
      // Fallback to JSON field
      return !!ex.upcoming;
    }

    function buildList(items) {
      if (!items.length) return '<p style="font-family:\'Space Mono\',monospace;font-size:.7rem;opacity:.4;padding:2rem 0;letter-spacing:.08em;text-transform:uppercase">None yet.</p>';

      const upcoming = items.filter(e => isUpcoming(e));
      const past     = items.filter(e => !isUpcoming(e));
      let html = '';

      if (upcoming.length) {
        html += '<p class="exh-section-label reveal">Upcoming</p>';
        html += upcoming.map(exhRow).join('');
        if (past.length) html += '<p class="exh-section-label reveal" style="margin-top:2.5rem">Past</p>';
      }
      html += past.map(exhRow).join('');
      return html;
    }

    function exhRow(ex) {
      const venueLine = `${esc(ex.venue)}, ${esc(ex.city||'')} &nbsp;·&nbsp; ${esc(ex.dates)}`;
      if (ex.page) {
        return `<a href="${esc(ex.page)}" class="exh-item linked reveal">
          <div class="exh-year">${esc(ex.year)}</div>
          <div class="exh-body">
            <div class="exh-name">${esc(ex.displayTitle||ex.title)}</div>
            <div class="exh-venue">${venueLine}</div>
          </div>
          <div class="exh-badge" style="display:flex;align-items:center;gap:0.75rem;">
            ${isUpcoming(ex) ? '<span class="tag yellow">Upcoming</span>' : ''}
            <span class="exh-arrow">→</span>
          </div>
        </a>`;
      } else {
        return `<div class="exh-item reveal">
          <div class="exh-year">${esc(ex.year)}</div>
          <div class="exh-body">
            <div class="exh-name">${esc(ex.displayTitle||ex.title)}</div>
            <div class="exh-venue">${venueLine}</div>
          </div>
          <div class="exh-badge">${isUpcoming(ex) ? '<span class="tag yellow">Upcoming</span>' : ''}</div>
        </div>`;
      }
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    (async () => {
      try {
        const r = await fetch('data/exhibitions.json');
        if (!r.ok) throw new Error();
        renderExhibitions(await r.json());
      } catch(_) {
        ['tab-solo','tab-group'].forEach(id => {
          document.getElementById(id).innerHTML =
            '<p style="font-family:\'Space Mono\',monospace;font-size:.7rem;opacity:.4;padding:2rem 0;letter-spacing:.08em;text-transform:uppercase">Could not load exhibitions.</p>';
        });
      }
    })();
  </script>
</body>
</html>
